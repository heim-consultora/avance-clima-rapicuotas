name: Actualizar y publicar tablero

on:
  schedule:
    - cron: "17 * * * *"     # cada hora (GitHub puede demorarlo algunos minutos)
  workflow_dispatch:          # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]          # cuando se edita config.js u otro archivo

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tablero
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SM_TOKEN: ${{ secrets.SM_TOKEN }}
      SM_SURVEY_ID: ${{ secrets.SM_SURVEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer respuestas de SurveyMonkey y recalcular conteos
        if: env.SM_TOKEN != '' && env.SM_SURVEY_ID != ''
        run: python scripts/actualizar.py

      - name: Guardar data.js si hubo respuestas nuevas
        run: |
          if git diff --quiet data.js; then
            echo "Sin respuestas nuevas."
          else
            git config user.name "tablero-bot"
            git config user.email "tablero-bot@users.noreply.github.com"
            git add data.js
            git commit -m "Actualiza conteos de participación"
            git push
          fi

      - name: Armar sitio (solo archivos públicos)
        run: |
          mkdir -p _site
          cp index.html config.js data.js _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
